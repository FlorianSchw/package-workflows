name: Test Coverage Suggestions

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']
  schedule:
    - cron: '0 7 1 * *'   # monthly sweep of the whole package
  workflow_dispatch:

jobs:
  suggest-tests:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: FlorianSchw/package-workflows/.github/workflows/test-coverage-suggest.yml@main
    with:
      # PRs check only changed files; scheduled and manual runs sweep everything.
      scan-mode: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
      # DataSHIELD packages only:
      # datashield: true
      # datashield-type: client   # or server
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TESTS }}
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml@main
