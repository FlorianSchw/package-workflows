name: Test Suggestions

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']
  # Optional: also on pushes to your working branches (main left out).
  # push:
  #   branches-ignore: [main]
  #   paths: ['R/**']
  schedule:
    - cron: '0 7 1 * *'   # monthly sweep of the whole package
  workflow_dispatch:

jobs:
  suggest-tests:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: FlorianSchw/package-workflows/.github/workflows/test-suggest.yml@main
    # PR or push: only what is new since the last run. Schedule: sweep of dev;
    # manual run: sweep of the branch chosen in "Run workflow".
    # with:
      # DataSHIELD packages only:
      # datashield: true
      # datashield-type: client   # or server, utility
      # dslite-setup: auto        # create a DSLite test setup only if the tests can't connect yet
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TESTS }}
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml@main
