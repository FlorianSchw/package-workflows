name: DESCRIPTION Author Suggestions

on:
  pull_request:
    branches: [dev]
  # Optional: also on pushes to your working branches (main left out). Credits
  # the authors of each push's new commits. No paths filter, so contributors
  # of tests or docs are seen too.
  # push:
  #   branches-ignore: [main]

jobs:
  suggest-authors:
    permissions:
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/authors-suggest.yml@main
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
