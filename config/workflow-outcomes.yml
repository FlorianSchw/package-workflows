# What workflows produce, for the workflow-graphs diagrams and table
# (.github/workflow-graphs/README.md). This can't be read from the YAML
# reliably, so it is described here. A repository can override this file
# (same path in its own repository) to describe its own workflows — start
# from a copy, since yours replaces this one.
#
# outcomes:  short names for common results, with their wording.
# workflows: per workflow, what it produces — a reusable workflow as
#            "<owner>/<repo>/<path>" (without @ref), a workflow of the
#            repository itself as ".github/workflows/<file>". Each entry is
#            one of the short names above or its own wording; "{name}" is
#            filled in with the calling job's input of that name (or the
#            input's default). Workflows not listed get no outcome boxes.
#            When the job only runs under a condition, it is added to the
#            outcome automatically (e.g. "only for PRs from bot-suggest/
#            branches"). An outcome that depends on the event is written
#            as {outcome: <name or wording>, only-on: <event>}, e.g.
#            {outcome: commit, only-on: push}.

outcomes:
  suggestion-pr: Suggestion PR
  pr-comment: Comment on the PR
  merge: PR merged
  release: Version commit, tag and draft release
  commit: Commit on the branch
  branch-deleted: Bot branch deleted
  keepalive: Scheduled workflows kept enabled

workflows:
  FlorianSchw/package-workflows/.github/workflows/r-cmd-check.yml: ["Check: R CMD check passes"]
  FlorianSchw/package-workflows/.github/workflows/commitlint.yml: ["Check: commit messages follow Conventional Commits"]
  FlorianSchw/package-workflows/.github/workflows/require-head-branch.yml: ["Check: PR comes from {allowed-head}"]
  FlorianSchw/package-workflows/.github/workflows/authors-suggest.yml: [suggestion-pr, {outcome: pr-comment, only-on: pull_request}]
  FlorianSchw/package-workflows/.github/workflows/roxygen-suggest.yml: [suggestion-pr, {outcome: pr-comment, only-on: pull_request}]
  FlorianSchw/package-workflows/.github/workflows/test-suggest.yml: [suggestion-pr, {outcome: pr-comment, only-on: pull_request}, "Issue for a likely bug in the code"]
  FlorianSchw/package-workflows/.github/workflows/cleanup-suggestion-branch.yml: [branch-deleted]
  FlorianSchw/package-workflows/.github/workflows/merge-pull-request.yml: [merge]
  FlorianSchw/package-workflows/.github/workflows/create-issue.yml: ["Issue for the PR author"]
  FlorianSchw/package-workflows/.github/workflows/package-release.yml: [release]
  FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml: [keepalive]
  FlorianSchw/package-workflows/.github/workflows/workflow-graphs.yml:
    - {outcome: commit, only-on: push}
    - {outcome: "Note on the PR: runs on push only", only-on: pull_request}
