# Style guide of the roxygen bot. A project's own config/roxygen-style.yml
# is merged over this file key by key: write only what you change (lists,
# such as tag_order, are replaced as a whole).

# Order of the tags in a rewritten block; "*" is where every tag not named
# here goes, in its original order.
tag_order: [title, description, details, param, return, "*", author, import, importFrom, examples, export]

# Per field: whether it must exist, and the guidance Claude gets.
exported:
  title:
    required: true
    guidance: Max 10 words. A short, plain phrase naming what the function does.
  description:
    required: true
    guidance: Max 2 lines. One or two sentences expanding on the title.
  details:
    required: false
    guidance: Up to 4 lines. Reference relevant base/stats/tidyverse functions this builds on, where it aids understanding.
  param:
    required: true
    guidance: One line per parameter. State the expected type and purpose concisely.
  return:
    required: true
    guidance: 1-2 sentences. Describe the type and shape of the returned value, including any disclosure-control or safety behavior relevant to the caller.
  examples:
    required: true
    guidance: A runnable example. See role-specific guidance for DataSHIELD packages.

internal:
  title:
    required: true
    guidance: Max 10 words.
  description:
    required: false
    guidance: Max 2 lines, only if the function's purpose isn't obvious from the title.
  details:
    required: false
    guidance: Up to 4 lines.
  param:
    required: true
    guidance: One line per parameter.
  return:
    required: true
    guidance: 1-2 sentences.
  examples:
    required: false
    guidance: Optional — skip for straightforward internal helpers.
