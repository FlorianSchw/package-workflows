default:
  anthropic:
    model: claude-sonnet-5
    max_tokens: 4096
    api_version: "2023-06-01"
    thinking:
      type: disabled
    tool_choice_type: tool

roxygen-review:
  anthropic:
    tool_name: submit_review
    max_tokens: 8192   # room for reasoning on possible bugs and judging earlier findings
  accept_reasons: [missing, inaccurate, incomplete]   # not: clarity, style
  code_issue_confidence: [high, medium]   # possible bugs reported (verdict "defect" only)

test-review:
  anthropic:
    tool_name: submit_tests
    model: claude-opus-5
    max_tokens: 32000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]
  accept_reasons: [uncovered_branch, error_handling, edge_case, regression]   # not: other
  max_new_tests: 10   # per function and run; changes to existing tests don't count

datashield-analysis:
  anthropic:
    tool_name: submit_analysis_scripts
    model: claude-opus-5
    max_tokens: 32000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]

test-failure-classification:
  anthropic:
    tool_name: submit_failure_classification
    model: claude-opus-5
    max_tokens: 16000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]
