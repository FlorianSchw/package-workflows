# Wording of datashield-analysis-suggest.yml: script headers, the
# dependencies.R block, the pull request description, notes and the
# prefilled issue. A project can change single texts with its own
# config/analysis-texts.yml holding only those entries; it is merged over
# these defaults, key by key. {{PLACEHOLDERS}} are filled in by R; keep
# the ones a text uses. {{MAIN}}, {{DEPENDENCIES}}, {{TESTING}} and
# {{PRODUCTION}} come from the paths and profiles in analysis-suggest.yml.

# Problems in the analysis plan, shown in the job summary before anything
# else runs. {{LABEL}} names the entry, e.g. "study study1".
plan:
  not_found: "Analysis plan not found: {{PATH}}"
  not_yaml: "{{PATH}} is not valid YAML: {{ERROR}}"
  not_mapping: "{{PATH}} is empty or not a YAML mapping."
  problems: "{{PATH}} has {{COUNT}} problem(s):"
  label_study: "study {{NAME}}"
  label_variable: "variable {{NAME}}"
  label_entry: "{{SECTION}}[{{INDEX}}]"
  symbol: "symbol must be a plain R name, e.g. D."
  no_studies: "studies: list at least one study, each with a server name and its packages."
  server_name: "{{LABEL}}: server must be a plain R name (letters, digits, . and _), as in 01_DS_Login.R."
  packages: "{{LABEL}}: packages must list the installed server packages with their versions, e.g. {dsBase: \"6.3.2\"}."
  one_version: "{{LABEL}}: give one version per package ({{PACKAGES}})."
  version_quotes: "{{LABEL}}: write versions in quotes, e.g. \"6.10\" ({{PACKAGES}}); without quotes YAML reads 6.10 as the number 6.1."
  duplicate_servers: "studies: server names must be unique ({{NAMES}})."
  no_variables: "variables: list the variables the analysis uses, with name, type and categories or range."
  variable_name: "{{LABEL}}: name must be the variable name as in the data."
  variable_type: "{{LABEL}}: type must be one of {{TYPES}}."
  categories: "{{LABEL}}: categorical variables need at least two categories."
  range: "{{LABEL}}: range must be [min, max] with min < max."
  duplicate_variables: "variables: names must be unique ({{NAMES}})."
  no_steps: "steps: list at least one step with a title."
  step_title: "{{LABEL}}: every step needs a title."
  step_id: "step '{{TITLE}}': id may only contain letters, digits, _ and -."
  duplicate_steps: "steps: ids must be unique ({{NAMES}}); give steps with the same title an explicit id."
  package_status: "package-status may only list {{ALLOWED}} (found: {{FOUND}})."

script:
  header:
    - "#### {{TITLE}}"
    - "#### Drafted by the datashield-analysis-suggest workflow from {{PLAN_FILE}}."
    - "#### A starting point: check and adapt it. The analysis is your responsibility."
    - "#### Tested with {{TESTED_WITH}}, on mock data in DSLite."
  notes_only: "#### No code: this step isn't possible with the packages on your study servers."

dependencies:
  clients: "#### Client packages for your studies' server packages (tested)"
  servers: "#### Server packages, only needed for local testing with DSLite"
  not_on_servers:
    - "#### Not yet installed on your study servers. Uncomment once they are, or to"
    - "#### try them locally with DSLite (see the suggestion PR for what they'd enable):"

step:
  edited_plan_changed: "its plan entry changed, but you have edited its script, so it was left as it is."
  removed: "no longer in the plan. Its script was kept; delete it (and its line in `{{MAIN}}`) if you don't need it."
  no_answer: "not proposed, because Claude returned no code or notes for it. It is requested again on the next run."
  still_failing: "not proposed, because the code still failed after {{ATTEMPTS}} attempt(s): {{PROBLEMS}}"
  long_section: "A section of step `{{STEP}}` is longer than {{MAX_LINES}} lines and has a file of its own."

notes:
  package_missing_on_studies: "`{{PACKAGE}}` is not installed on {{STUDIES}}, so it isn't used; functions from it would only work if those studies are left out."
  package_versions_differ: "`{{PACKAGE}}` has different versions on the studies ({{VERSIONS}}); tested with {{LOWEST}} (the lowest, or the first study's if they can't be compared)."
  version_not_found: "`{{PACKAGE}}` {{VERSION}} could not be found; tested with {{INSTALLED}} from `{{REF}}` instead."
  not_installable: "`{{PACKAGE}}` {{VERSION}} could not be installed from CRAN or GitHub, so it wasn't used."
  no_login_file: "No login file at `{{PATH}}`; the scripts assume the connections are called `conns`."
  credentials: "**`{{PATH}}` seems to contain credentials as plain text** (line {{LINES}}). Everyone with access to this repository can read them. Move them to `.Renviron` and read them with `Sys.getenv()`, as the dsAnalysis template does."
  servers_differ: "The servers in `{{PATH}}` ({{FOUND}}) differ from the plan ({{PLANNED}}). The scripts use the plan's names, e.g. for results per study."
  symbol_differs: "`{{PATH}}` assigns the data to `{{FOUND}}`, the plan says `{{PLANNED}}`. The scripts use `{{PLANNED}}`."
  existing_failed: "Your existing script `{{FILE}}` failed in the test run: {{ERROR}}"
  retired_included: "The plan's package-status includes `retired`, so retired packages may be suggested. They are no longer maintained; check before relying on one."
  block_damaged: "The bot's block in `{{PATH}}` is damaged (a marker line is missing, doubled or out of order), so it was left as it is. Please update it by hand, or remove both marker lines so the bot adds a new block."

# Problems the checks find. Claude gets them in the repair round, and the
# report shows them as the reason a step wasn't proposed.
checks:
  does_not_parse: "The code does not parse: {{ERROR}}"
  unknown_function: "{{FUNCTION}}() does not exist in the installed client packages, or may not be used."
  unknown_argument: "{{FUNCTION}}() has no argument {{GIVEN}} (its arguments: {{ARGUMENTS}})."
  unknown_column: "{{COLUMNS}} refers to a column that is neither a variable of the plan nor created by any step (plan variables: {{VARIABLES}})."
  runtime_error: "Error when running {{FILE}}: {{ERROR}}"
  timeout: "The test run took longer than {{SECONDS}} seconds and was stopped; the code may loop or do far more work than needed."

report:
  nothing_to_do: "Nothing to do: every step of the plan already has an up-to-date script."
  intro: "Starter scripts for your DataSHIELD analysis, drafted from your analysis plan. Each script ran in DSLite on mock data generated from the plan. That checks the code runs, not that the analysis is right: please read and adapt it. The analysis stays your responsibility."
  tested_with: "**Tested with:** {{TESTED_WITH}}."
  scripts_heading: "### Scripts"
  notes_only_suffix: " (notes only: not possible with the installed packages)"
  try_it: "**Try it yourself:** set `R_CONFIG_ACTIVE = '{{TESTING}}'` in `.Renviron`, restart R and run `{{MAIN}}`. It uses the same DSLite setup and mock data as this test run. You get the same results if you install the versions listed in `{{DEPENDENCIES}}`. Switch back to `{{PRODUCTION}}` for the real analysis."
  other_package_heading: "### Possible with another package"
  other_package_intro: "Not installed on your study servers. The packages are listed, commented out, in `{{DEPENDENCIES}}`."
  gaps_heading: "### Not possible with any known DataSHIELD package"
  gaps_intro: "The link opens a prefilled issue under your account, so missing functions can be collected. Check the text before you submit it."
  open_issue: "Open issue"
  limitations_heading: "### Limitations"
  other_notes_heading: "### Not proposed, and other notes"
  plan_errors_heading: "### The analysis plan needs fixing"

issue:
  title: "Missing DataSHIELD function: {{NOTE}}"
  body: |
    Reported from the DataSHIELD analysis starter (datashield-analysis-suggest).

    **Analysis step:** {{STEP}}

    **What is missing:** {{NOTE}}

    _Please add what you would need, e.g. the method, its inputs and outputs._
