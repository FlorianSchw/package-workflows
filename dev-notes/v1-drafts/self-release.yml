# Draft — releases this repository on every push to main (a merged dev →
# main PR): semantic-release tags vX.Y.Z from the conventional commits,
# publishes the GitHub release and moves the major tag vX (successCmd in
# self.releaserc.json), and commits CHANGELOG.md to main ("[skip ci]") —
# the App is the ruleset's bypass actor for that. Goes to .github/workflows/release.yml.
#
# Not package-release.yml: that one is for R packages (DESCRIPTION
# version, drafts), and its default config stays the root
# .releaserc.json (user's decision 2026-10-19). This repository's own
# config (self.releaserc.json) goes to .github/release/releaserc.json and
# is passed with --extends.
#
# CHANGELOG.md is only on main; dev doesn't need it back (nothing on dev
# touches it), so no back-merge.
#
# Pushing tags: the App token (its App is the bypass actor of the
# "release tags" ruleset), so GITHUB_TOKEN can't move vX by itself.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags, the CHANGELOG commit and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve push token
        id: token
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # The moving-tag push in successCmd goes through this remote.
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx --yes -p semantic-release@24 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p @semantic-release/exec@6 semantic-release --extends ./.github/release/releaserc.json  # zizmor: ignore[adhoc-packages]
