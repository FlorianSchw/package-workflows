# Draft of config/suggestion-policy.yml (v1 plan, D) — not read by
# anything yet. The tunable rules of the roxygen, test and authors bots.
# A project's own config/suggestion-policy.yml is merged over this key by
# key (maps merge, lists and values replace), so it only writes what it
# changes. The workflow inputs accept-reasons and code-issue-confidence
# still override the matching keys. Safety rules that are not
# configurable are listed in dev-notes/suggestion-thresholds.md.
#
# Every `meaning` is written into the tool schema's enum description and
# into the prompt by R, so a reason is defined in one place only.

roxygen:
  reasons:
    missing:
      meaning: the field is absent or a placeholder
      accept: true
    inaccurate:
      meaning: the existing text states something the code doesn't do, even if the fix is a small wording change
      accept: true
    incomplete:
      meaning: it leaves out something the code does
      accept: true
    clarity:
      meaning: correct and complete, but could be clearer
      accept: false
    style:
      meaning: formatting or wording only
      accept: false

tests:
  reasons:
    uncovered_branch:
      meaning: a code path no existing test reaches
      accept: true
    error_handling:
      meaning: an error or warning the function raises
      accept: true
    edge_case:
      meaning: unusual but valid input (NA, empty, boundary values)
      accept: true
    regression:
      meaning: pins down behavior likely to break on change
      accept: true
    other:
      meaning: none of these
      accept: false
  max_new_tests: 10        # per function and run; changes to existing tests don't count

possible_bugs:
  # Claude's confidence levels that are reported at all (empty list: not
  # asked for, no such section), and those that also open an issue.
  report: [high, medium]
  open_issue: [high]

authors:
  roles:
    changed_r_code: aut    # any commit of theirs changed R/*.R
    otherwise: ctb
  upgrade_only: true       # ctb -> aut; nobody is downgraded or removed
  family_name_particles: [van, von, de, der, den, del, della, di, da, das, dos, du, la, le, ten, ter, zu]

# Where each kind of finding goes. Destinations: report (the bot PR's
# description), comment (on the originating PR, once), issue (needs
# `issues: write` on the caller job), log (job log only).
# `with_bot_pr`: a bot PR is open or created in this run; `without`:
# none, on a PR or push; `all_mode`: a full review (review-scope all).
routing:
  roxygen:
    possible_bug:        { with_bot_pr: report, without: comment, all_mode: issue }
    not_applied_change:  { with_bot_pr: report, without: log,     all_mode: report }
  tests:
    possible_bug:        { with_bot_pr: report, without: comment, all_mode: issue }
    failed_new_test:     { with_bot_pr: comment, without: comment, all_mode: report }
    existing_test_note:  { with_bot_pr: report, without: comment, all_mode: issue }
  authors:
    possible_match:      { with_bot_pr: report, without: comment }   # no issue: authors callers don't grant issues: write
