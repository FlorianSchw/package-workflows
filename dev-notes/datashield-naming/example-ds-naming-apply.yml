# Caller for the naming apply step, in the same client package: runs when
# the reviewed transformation file lands on the branch (the review PR is
# merged), and by hand. Not in examples/ (the docs) until the rules are
# agreed.
name: DataSHIELD Argument Naming Apply

on:
  push:
    branches: [v7.0-dev]
    paths: ['.github/ds-naming/transformations.yml']
  workflow_dispatch:

jobs:
  apply-naming:
    permissions:
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/ds-naming-apply.yml@main
    with:
      server-repository: datashield/dsBase
      server-ref: v7.0-dev
      # base-branch: next              # a shared integration branch, if used
      # server-base-branch: next
    secrets:
      # The App must be installed on both repositories (same owner).
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
