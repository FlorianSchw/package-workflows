name: 'Resolve Push Token'
description: 'GitHub App installation token, so bot pushes and PRs trigger workflows (GITHUB_TOKEN ones do not). Empty if neither client-id nor app-id is set.'
inputs:
  client-id:
    description: 'GitHub App Client ID (Iv23li...).'
    required: false
  app-id:
    description: 'Deprecated: numeric GitHub App ID, used only if client-id is unset.'
    required: false
  app-private-key:
    description: 'GitHub App private key. Required if client-id or app-id is set.'
    required: false
outputs:
  token:
    description: 'Resolved App installation token, or empty string if no App was supplied.'
    value: ${{ steps.client_id_token.outputs.token || steps.app_id_token.outputs.token }}
runs:
  using: 'composite'
  steps:
    - name: Generate App token
      id: client_id_token
      if: inputs.client-id != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}

    # Separate step: passing app-id at all triggers the action's deprecation warning.
    - name: Generate App token (deprecated app-id)
      id: app_id_token
      if: inputs.client-id == '' && inputs.app-id != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
