name: 'Resolve Push Token'
description: 'GitHub App installation token, so bot pushes and PRs trigger workflows (GITHUB_TOKEN ones do not). Empty if client-id is unset.'
inputs:
  client-id:
    description: 'GitHub App Client ID (Iv23li...).'
    required: false
  app-private-key:
    description: 'GitHub App private key. Required if client-id is set.'
    required: false
  repositories:
    description: 'Further repositories of the same owner the token must reach (comma-separated names, e.g. "dsBase"); empty: only the current one.'
    required: false
    default: ''
outputs:
  token:
    description: 'Resolved App installation token, or empty string if client-id was not supplied.'
    value: ${{ steps.app_token.outputs.token }}
runs:
  using: 'composite'
  steps:
    - name: List repositories
      id: scope
      if: inputs.client-id != '' && inputs.repositories != ''
      shell: bash
      env:
        MORE: ${{ inputs.repositories }}
      run: echo "repositories=${GITHUB_REPOSITORY#*/},${MORE}" >> "$GITHUB_OUTPUT"

    - name: Generate App token
      id: app_token
      if: inputs.client-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        # Empty: the current repository only (the action's default).
        owner: ${{ steps.scope.outputs.repositories != '' && github.repository_owner || '' }}
        repositories: ${{ steps.scope.outputs.repositories }}
        # Only what the bots' pushes, PRs and releases need, not everything
        # the App's installation may do.
        permission-contents: write
        permission-pull-requests: write
