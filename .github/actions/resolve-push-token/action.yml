name: 'Resolve Push Token'
description: 'GitHub App installation token, so bot pushes and PRs trigger workflows (GITHUB_TOKEN ones do not). Empty if app-id is unset.'
inputs:
  app-id:
    description: 'GitHub App ID.'
    required: false
  app-private-key:
    description: 'GitHub App private key. Required if app-id is set.'
    required: false
outputs:
  token:
    description: 'Resolved App installation token, or empty string if app-id was not supplied.'
    value: ${{ steps.app_token.outputs.token }}
runs:
  using: 'composite'
  steps:
    - name: Generate App token
      id: app_token
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
