name: 'Commit Updated Files'
description: >-
  Commits exactly the files listed in the manifest and proposes them as a PR.
  "changed": per-file commits on a sub-branch, PR back into the current branch,
  so its author reviews them. "all": one commit on a dated sweep branch,
  PR against sweep-base. No-op when nothing actually changed. The logic is in
  commit-updated-files.sh next to this file.
inputs:
  scan-mode:
    description: '"changed" or "all".'
    required: true
  token:
    description: 'Token used to push (and to open the PR).'
    required: true
  manifest:
    description: 'Manifest file, one path per line.'
    required: false
    default: 'updated_files.txt'
  pr-body-file:
    description: 'File appended to the sub-PR or sweep PR body if it exists (optional).'
    required: false
  comment-summary-file:
    description: '"changed" mode: one-line summary added to the link comment if the file exists (optional).'
    required: false
  commit-prefix:
    description: '"changed" mode: per-file commit message prefix; the file path is appended.'
    required: false
  sub-branch-prefix:
    description: '"changed" mode: sub-branch name prefix; the sanitized current branch name is appended.'
    required: false
  sub-pr-title:
    description: '"changed" mode: sub-PR title.'
    required: false
  sub-pr-body:
    description: '"changed" mode: sub-PR body.'
    required: false
  origin-pr-number:
    description: '"changed" mode: PR to notify with a link when a new sub-PR is opened (optional).'
    required: false
  sweep-branch-prefix:
    description: '"all" mode: branch name prefix; "-YYYY-MM" is appended.'
    required: false
  sweep-commit-message:
    description: '"all" mode: commit message.'
    required: false
  sweep-pr-title:
    description: '"all" mode: PR title.'
    required: false
  sweep-pr-body:
    description: '"all" mode: PR body.'
    required: false
  sweep-base:
    description: '"all" mode: PR base branch.'
    required: false
    default: 'dev'
runs:
  using: 'composite'
  steps:
    - name: Commit and push
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        MANIFEST: ${{ inputs.manifest }}
        PR_BODY_FILE: ${{ inputs.pr-body-file }}
        COMMENT_SUMMARY_FILE: ${{ inputs.comment-summary-file }}
        COMMIT_PREFIX: ${{ inputs.commit-prefix }}
        SUB_BRANCH_PREFIX: ${{ inputs.sub-branch-prefix }}
        SUB_PR_TITLE: ${{ inputs.sub-pr-title }}
        SUB_PR_BODY: ${{ inputs.sub-pr-body }}
        ORIGIN_PR_NUMBER: ${{ inputs.origin-pr-number }}
        SWEEP_BRANCH_PREFIX: ${{ inputs.sweep-branch-prefix }}
        SWEEP_COMMIT_MESSAGE: ${{ inputs.sweep-commit-message }}
        SWEEP_PR_TITLE: ${{ inputs.sweep-pr-title }}
        SWEEP_PR_BODY: ${{ inputs.sweep-pr-body }}
        SWEEP_BASE: ${{ inputs.sweep-base }}
      run: bash "$GITHUB_ACTION_PATH/commit-updated-files.sh"
