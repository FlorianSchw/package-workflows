name: 'Commit Updated Files'
description: >-
  Commits exactly the files listed in a manifest (one path per line, written
  by the suggestion script) — never anything else in the working tree, so
  the workflow's own scratch files (.Renviron, files_to_check.txt, the
  .shared-workflows checkout) can't be picked up. scan-mode "changed": one
  commit per file, on a new sub-branch derived from the current branch,
  pushed and opened as a PR *back into the current branch* — never
  committed directly onto it, so nothing triggers downstream workflow
  approval gates and the original branch's own author gets final review.
  scan-mode "all": one commit on a new dated sweep branch, pushed, with a
  PR opened against sweep-base. Does nothing if the manifest is missing,
  empty, or lists only files with no actual changes.
inputs:
  scan-mode:
    description: '"changed" or "all".'
    required: true
  token:
    description: 'Token used to push (and to open the PR).'
    required: true
  manifest:
    description: 'Path to the manifest file.'
    required: false
    default: 'updated_files.txt'
  commit-prefix:
    description: '"changed" mode: per-file commit message prefix; the file path is appended.'
    required: false
  sub-branch-prefix:
    description: '"changed" mode: sub-branch name prefix; the sanitized current branch name is appended.'
    required: false
  sub-pr-title:
    description: '"changed" mode: sub-PR title.'
    required: false
  sub-pr-body:
    description: '"changed" mode: sub-PR body.'
    required: false
  sweep-branch-prefix:
    description: '"all" mode: branch name prefix; "-YYYY-MM" is appended.'
    required: false
  sweep-commit-message:
    description: '"all" mode: commit message.'
    required: false
  sweep-pr-title:
    description: '"all" mode: PR title.'
    required: false
  sweep-pr-body:
    description: '"all" mode: PR body.'
    required: false
  sweep-base:
    description: '"all" mode: PR base branch.'
    required: false
    default: 'dev'
runs:
  using: 'composite'
  steps:
    - name: Commit and push
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        MANIFEST: ${{ inputs.manifest }}
        COMMIT_PREFIX: ${{ inputs.commit-prefix }}
        SUB_BRANCH_PREFIX: ${{ inputs.sub-branch-prefix }}
        SUB_PR_TITLE: ${{ inputs.sub-pr-title }}
        SUB_PR_BODY: ${{ inputs.sub-pr-body }}
        SWEEP_BRANCH_PREFIX: ${{ inputs.sweep-branch-prefix }}
        SWEEP_COMMIT_MESSAGE: ${{ inputs.sweep-commit-message }}
        SWEEP_PR_TITLE: ${{ inputs.sweep-pr-title }}
        SWEEP_PR_BODY: ${{ inputs.sweep-pr-body }}
        SWEEP_BASE: ${{ inputs.sweep-base }}
      run: |
        if [ ! -s "$MANIFEST" ]; then
          echo "No updated files — nothing to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

        if [ "$SCAN_MODE" = "all" ]; then
          while IFS= read -r f; do
            git add -- "$f"
          done < "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Manifest files have no actual changes — skipping sweep PR."
            exit 0
          fi
          BRANCH="${SWEEP_BRANCH_PREFIX}-$(date +%Y-%m)"
          git checkout -b "$BRANCH"
          git commit -m "$SWEEP_COMMIT_MESSAGE"
          git push origin "$BRANCH"
          gh pr create --base "$SWEEP_BASE" --head "$BRANCH" --title "$SWEEP_PR_TITLE" --body "$SWEEP_PR_BODY"
        else
          ORIGINAL_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$ORIGINAL_BRANCH" = "HEAD" ]; then
            echo "::error::Detached HEAD — expected a named branch to be checked out. Aborting."
            exit 1
          fi
          SUB_BRANCH="${SUB_BRANCH_PREFIX}/$(echo "$ORIGINAL_BRANCH" | tr '/' '-')"

          git checkout -b "$SUB_BRANCH"

          COMMITTED=false
          while IFS= read -r f; do
            git add -- "$f"
            if git diff --cached --quiet -- "$f"; then
              echo "No actual change for $f — skipping commit."
              continue
            fi
            git commit -m "$COMMIT_PREFIX $f"
            COMMITTED=true
          done < "$MANIFEST"

          if [ "$COMMITTED" != "true" ]; then
            echo "No files actually changed — skipping sub-branch push."
            exit 0
          fi

          git push --force origin "$SUB_BRANCH"

          if ! gh pr view "$SUB_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base "$ORIGINAL_BRANCH" --head "$SUB_BRANCH" --title "$SUB_PR_TITLE" --body "$SUB_PR_BODY"
          fi
        fi
