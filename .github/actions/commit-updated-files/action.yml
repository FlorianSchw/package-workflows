name: 'Commit Updated Files'
description: >-
  Commits exactly the files listed in the manifest — never other working
  tree files such as files_to_check.txt or the .shared-workflows checkout —
  and proposes them as a PR. "changed": per-file commits on a sub-branch,
  PR back into the current branch, so its author reviews them. "all": one
  commit on a dated sweep branch, PR against sweep-base. No-op when nothing
  actually changed.
inputs:
  scan-mode:
    description: '"changed" or "all".'
    required: true
  token:
    description: 'Token used to push (and to open the PR).'
    required: true
  manifest:
    description: 'Manifest file, one path per line.'
    required: false
    default: 'updated_files.txt'
  commit-prefix:
    description: '"changed" mode: per-file commit message prefix; the file path is appended.'
    required: false
  sub-branch-prefix:
    description: '"changed" mode: sub-branch name prefix; the sanitized current branch name is appended.'
    required: false
  sub-pr-title:
    description: '"changed" mode: sub-PR title.'
    required: false
  sub-pr-body:
    description: '"changed" mode: sub-PR body.'
    required: false
  origin-pr-number:
    description: '"changed" mode: PR to notify with a link when a new sub-PR is opened (optional).'
    required: false
  sweep-branch-prefix:
    description: '"all" mode: branch name prefix; "-YYYY-MM" is appended.'
    required: false
  sweep-commit-message:
    description: '"all" mode: commit message.'
    required: false
  sweep-pr-title:
    description: '"all" mode: PR title.'
    required: false
  sweep-pr-body:
    description: '"all" mode: PR body.'
    required: false
  sweep-pr-body-file:
    description: '"all" mode: file appended to the PR body if it exists (optional).'
    required: false
  sweep-base:
    description: '"all" mode: PR base branch.'
    required: false
    default: 'dev'
runs:
  using: 'composite'
  steps:
    - name: Commit and push
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        MANIFEST: ${{ inputs.manifest }}
        COMMIT_PREFIX: ${{ inputs.commit-prefix }}
        SUB_BRANCH_PREFIX: ${{ inputs.sub-branch-prefix }}
        SUB_PR_TITLE: ${{ inputs.sub-pr-title }}
        SUB_PR_BODY: ${{ inputs.sub-pr-body }}
        ORIGIN_PR_NUMBER: ${{ inputs.origin-pr-number }}
        SWEEP_BRANCH_PREFIX: ${{ inputs.sweep-branch-prefix }}
        SWEEP_COMMIT_MESSAGE: ${{ inputs.sweep-commit-message }}
        SWEEP_PR_TITLE: ${{ inputs.sweep-pr-title }}
        SWEEP_PR_BODY: ${{ inputs.sweep-pr-body }}
        SWEEP_PR_BODY_FILE: ${{ inputs.sweep-pr-body-file }}
        SWEEP_BASE: ${{ inputs.sweep-base }}
      run: |
        if [ ! -s "$MANIFEST" ]; then
          echo "No updated files — nothing to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

        if [ "$SCAN_MODE" = "all" ]; then
          while IFS= read -r f; do
            git add -- "$f"
          done < "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Manifest files have no actual changes — skipping sweep PR."
            exit 0
          fi
          BRANCH="${SWEEP_BRANCH_PREFIX}-$(date +%Y-%m)"
          git checkout -b "$BRANCH"
          git commit -m "$SWEEP_COMMIT_MESSAGE"
          # Force: a re-run in the same month replaces that month's branch.
          git push --force origin "$BRANCH"

          BODY_FILE="$(mktemp)"
          printf '%s\n' "$SWEEP_PR_BODY" > "$BODY_FILE"
          if [ -n "$SWEEP_PR_BODY_FILE" ] && [ -s "$SWEEP_PR_BODY_FILE" ]; then
            printf '\n' >> "$BODY_FILE"
            cat "$SWEEP_PR_BODY_FILE" >> "$BODY_FILE"
          fi

          # Only an OPEN PR counts, as in "changed" mode: update it rather
          # than opening a duplicate; after a merge or close, open a new one.
          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --title "$SWEEP_PR_TITLE" --body-file "$BODY_FILE"
          else
            gh pr create --base "$SWEEP_BASE" --head "$BRANCH" --title "$SWEEP_PR_TITLE" --body-file "$BODY_FILE"
          fi
        else
          ORIGINAL_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$ORIGINAL_BRANCH" = "HEAD" ]; then
            echo "::error::Detached HEAD — expected a named branch to be checked out. Aborting."
            exit 1
          fi
          SUB_BRANCH="${SUB_BRANCH_PREFIX}/$(echo "$ORIGINAL_BRANCH" | tr '/' '-')"

          git checkout -b "$SUB_BRANCH"

          COMMITTED_FILES=""
          while IFS= read -r f; do
            git add -- "$f"
            if git diff --cached --quiet -- "$f"; then
              echo "No actual change for $f — skipping commit."
              continue
            fi
            git commit -m "$COMMIT_PREFIX $f"
            COMMITTED_FILES="${COMMITTED_FILES}- \`$f\`"$'\n'
          done < "$MANIFEST"

          if [ -z "$COMMITTED_FILES" ]; then
            echo "No files actually changed — skipping sub-branch push."
            exit 0
          fi

          git push --force origin "$SUB_BRANCH"

          # Only an OPEN PR counts: the sub-branch name is reused per source
          # branch, and gh pr view would also match an earlier merged one.
          if [ "$(gh pr list --head "$SUB_BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            PR_URL=$(gh pr create --base "$ORIGINAL_BRANCH" --head "$SUB_BRANCH" --title "$SUB_PR_TITLE" --body "$SUB_PR_BODY")
            if [ -n "$ORIGIN_PR_NUMBER" ]; then
              COMMENT="**${SUB_PR_TITLE}** opened: ${PR_URL} (into \`${ORIGINAL_BRANCH}\`)"$'\n\n'"${COMMITTED_FILES}"
              gh pr comment "$ORIGIN_PR_NUMBER" --body "$COMMENT" || echo "::warning::Failed to post notification comment on PR #$ORIGIN_PR_NUMBER"
            fi
          fi
        fi
