name: Shared files
description: >-
  Copies this repository (R scripts, config, prompts, templates) into a
  folder of the workspace, at the commit the calling reusable workflow
  runs. Use it with `uses: $/.github/actions/shared-files`: the runner
  then fetches this action, and with it the whole repository, at that
  commit. (A checkout at github.job_workflow_sha doesn't work: that
  context property is empty, and actions/checkout then silently takes the
  default branch.)

inputs:
  path:
    description: Folder in the workspace to copy into (replaced). Must not be the workspace itself.
    required: false
    default: .shared-workflows

outputs:
  sha:
    description: The commit of this repository the workflow runs; empty if the runner's folder doesn't name it.
    value: ${{ steps.copy.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Copy this repository
      id: copy
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/shared-files.sh"
