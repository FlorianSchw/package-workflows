name: 'Resolve Suggestion Scope'
description: >-
  Decides, from the event alone and before any checkout, whether a
  suggestion run should do anything, in which mode, and on which branch.
  Skips (with a notice) deleted branches, tags, PRs from forks, Dependabot
  and the bot's own bot-suggest/* branches. review-scope "changed":
  what changed since the last review; "all": every file. The logic is in
  resolve-suggestion-scope.sh next to this file; design in
  dev-notes/suggestions-trigger-model.md.
inputs:
  review-scope:
    description: '"changed" or "all".'
    required: false
    default: 'changed'
  review-branch:
    description: 'Branch of scheduled and manual runs; empty: the chosen branch on manual runs, dev on schedules.'
    required: false
    default: ''
  allow-scheduled:
    description: '"false" for workflows that run on pull requests and pushes only (authors): schedule and manual runs are skipped.'
    required: false
    default: 'true'
outputs:
  skip:
    description: '"true" if the run should do nothing.'
    value: ${{ steps.scope.outputs.skip }}
  mode:
    description: '"changed" or "all" (empty when skipped).'
    value: ${{ steps.scope.outputs.mode }}
  ref:
    description: 'Branch to check out.'
    value: ${{ steps.scope.outputs.ref }}
  branch:
    description: 'The branch the run is about (PR head, pushed branch, or the branch of a scheduled or manual run).'
    value: ${{ steps.scope.outputs.branch }}
runs:
  using: 'composite'
  steps:
    - name: Resolve scope
      id: scope
      shell: bash
      env:
        REVIEW_SCOPE: ${{ inputs.review-scope }}
        REVIEW_BRANCH: ${{ inputs.review-branch }}
        ALLOW_SCHEDULED: ${{ inputs.allow-scheduled }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
      run: bash "$GITHUB_ACTION_PATH/resolve-suggestion-scope.sh"
