name: Test Coverage Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"changed" (new/modified functions in this PR) or "all" (whole-package sweep)'
        required: false
        type: string
        default: 'changed'
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule authorizing this repo'
        required: true
        type: string
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client" or "server" — only used when datashield is true'
        required: false
        type: string
        default: ''
    secrets:
      app-id:
        description: 'GitHub App ID — to create a short-lived App token. Optional'
        required: false
      app-private-key:
        description: 'GitHub App private key — to create a short-lived App token. Optional'
        required: false
      commit-push-pat:
        description: 'A classic or fine-grained PAT. Optional.'
        required: false

env:
  ANTHROPIC_ORG_ID: ab598c51-a4e1-4c60-943d-c04722aecf04
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_018HwE11GfPMYQhCYUQPeDS7

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      - name: Determine files to check
        id: files
        run: |
          if [ "${{ inputs.scan-mode }}" = "all" ]; then
            find R -name '*.R' > files_to_check.txt
          else
            git diff --name-only \
              origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'R/*.R' \
              > files_to_check.txt
          fi
          echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count != '0'
        with:
          use-public-rspm: true

      # needs: check installs the target package's own Imports/Suggests
      # (testthat, and — for DataSHIELD client packages — DSLite/DSI/the
      # relevant server package) from ITS DESCRIPTION automatically. Not yet
      # validated end to end against a real target repo — see
      # test-coverage-workflow-design-notes.md.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count != '0'
        with:
          extra-packages: any::httr2, any::jsonlite, any::purrr, any::config, any::testthat, any::devtools
          needs: check

      - name: Get GitHub OIDC token
        id: oidc
        if: steps.files.outputs.count != '0'
        run: |
          RESPONSE=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com")
          echo "github_token=$(echo "$RESPONSE" | jq -r '.value')" >> "$GITHUB_OUTPUT"

      - name: Exchange for Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count != '0'
        run: |
          RESPONSE=$(curl -sS -X POST https://api.anthropic.com/v1/oauth/token \
            -H "Content-Type: application/json" \
            -d '{
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": "${{ steps.oidc.outputs.github_token }}",
              "federation_rule_id": "${{ inputs.anthropic-federation-rule-id }}",
              "organization_id": "${{ env.ANTHROPIC_ORG_ID }}",
              "service_account_id": "${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}"
            }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::Token exchange failed: $(echo "$RESPONSE" | jq -c '.')"
            exit 1
          fi
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Create .Renviron file
        if: steps.files.outputs.count != '0'
        run: |
          echo R_CONFIG_ACTIVE = "test-review" >> .Renviron
        shell: bash

      - name: Run test suggestion script
        if: steps.files.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_tests.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/resolve-push-token@main
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit generated tests to PR branch
        if: inputs.scan-mode == 'changed' && steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s test_files_updated.txt ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r f; do
            git add "$f"
            if git diff --cached --quiet -- "$f"; then
              echo "No actual change for $f — skipping commit."
              continue
            fi
            git commit -m "test: add generated test for $f"
          done < test_files_updated.txt

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push

      - name: Check for changes
        id: diff
        if: inputs.scan-mode == 'all' && steps.files.outputs.count != '0'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with suggested tests
        if: inputs.scan-mode == 'all' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="tests/coverage-sweep-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/
          git commit -m "test: monthly test coverage sweep"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Monthly test coverage sweep" \
            --body "Automated generated tests from the test-coverage-suggest workflow. Every included test already passed a real run before being committed — review before merging."
