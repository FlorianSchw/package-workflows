name: Test Coverage Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"changed" (new/modified functions in this PR) or "all" (whole-package sweep)'
        required: false
        type: string
        default: 'changed'
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule authorizing this repo'
        required: true
        type: string
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client" or "server" — only used when datashield is true'
        required: false
        type: string
        default: ''
    secrets:
      app-id:
        description: 'GitHub App ID — to create a short-lived App token. Optional'
        required: false
      app-private-key:
        description: 'GitHub App private key — to create a short-lived App token. Optional'
        required: false
      commit-push-pat:
        description: 'A classic or fine-grained PAT. Optional.'
        required: false

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v7
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      - name: Determine files to check
        id: files
        run: |
          if [ "${{ inputs.scan-mode }}" = "all" ]; then
            find R -name '*.R' > files_to_check.txt
          else
            git diff --name-only \
              origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'R/*.R' \
              > files_to_check.txt
          fi
          echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count != '0'
        with:
          use-public-rspm: true

      # needs: check installs the target package's own Imports/Suggests
      # (testthat, and — for DataSHIELD client packages — DSLite/DSI/the
      # relevant server package) from ITS DESCRIPTION. The package itself is
      # loaded from source by run_test_blocks() via testthat/pkgload.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count != '0'
        with:
          extra-packages: any::httr2, any::jsonlite, any::purrr, any::config, any::testthat
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/anthropic-token@main
        with:
          federation-rule-id: ${{ inputs.anthropic-federation-rule-id }}

      - name: Create .Renviron file
        if: steps.files.outputs.count != '0'
        run: |
          echo R_CONFIG_ACTIVE = "test-review" >> .Renviron
        shell: bash

      - name: Run test suggestion script
        if: steps.files.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_tests.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/resolve-push-token@main
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit generated tests
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/commit-updated-files@main
        with:
          scan-mode: ${{ inputs.scan-mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'test: add generated test for'
          sub-branch-prefix: 'bot-suggest/tests'
          sub-pr-title: 'Generated test coverage suggestions'
          sub-pr-body: 'Automated generated tests. Every included test already passed a real run before being committed — review and merge to include them.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          sweep-branch-prefix: 'tests/coverage-sweep'
          sweep-commit-message: 'test: monthly test coverage sweep'
          sweep-pr-title: 'Monthly test coverage sweep'
          sweep-pr-body: 'Automated generated tests from the test-coverage-suggest workflow. Every included test already passed a real run before being committed — review before merging.'
