name: Test Coverage Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"changed" (R/ files changed in this PR) or "all" (sweep of R/*.R, see sweep-* inputs)'
        required: false
        type: string
        default: 'changed'
      sweep-base:
        description: '"all" mode: branch to scan and to open the sweep PR against'
        required: false
        type: string
        default: 'dev'
      sweep-lookback-days:
        description: '"all" mode: review functions whose file or test changed within this many days'
        required: false
        type: number
        default: 35
      sweep-rotation-months:
        description: '"all" mode: also review every function at least once in this many months (0: all, every sweep)'
        required: false
        type: number
        default: 6
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client" or "server" — only used when datashield is true'
        required: false
        type: string
        default: ''
    secrets:
      anthropic-organization-id:
        description: 'Anthropic organization ID.'
        required: true
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo.'
        required: true
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow.'
        required: true
      app-id:
        description: 'GitHub App ID; its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-tests:
    # Never review the bot's own suggestion or sweep PRs.
    if: ${{ !startsWith(github.head_ref, 'bot-suggest/') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.scan-mode == 'all' && inputs.sweep-base || github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v7
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      # A sweep reviews what changed recently (function file or its test
      # file within sweep-lookback-days) plus a rotating share of the rest,
      # so every function comes up at least once per sweep-rotation-months —
      # fewer Claude calls than all functions every month. The share is
      # picked by a stable hash of the file name.
      - name: Determine files to check
        id: files
        env:
          LOOKBACK_DAYS: ${{ inputs.sweep-lookback-days }}
          ROTATION: ${{ inputs.sweep-rotation-months }}
        run: |
          if [ "${{ inputs.scan-mode }}" = "all" ]; then
            find R -name '*.R' | sort > all_files.txt
            if [ "$ROTATION" -le 0 ]; then
              cp all_files.txt files_to_check.txt
            else
              git log --since="$LOOKBACK_DAYS days ago" --name-only --format= -- R tests/testthat | sort -u > recent_files.txt
              slot=$(( ($(date +%Y) * 12 + 10#$(date +%m)) % ROTATION ))
              while IFS= read -r f; do
                test_file="tests/testthat/test-$(basename "$f" .R).R"
                if grep -qxF -e "$f" -e "$test_file" recent_files.txt \
                   || [ $(( $(printf '%s' "$f" | cksum | cut -d' ' -f1) % ROTATION )) -eq "$slot" ]; then
                  echo "$f"
                fi
              done < all_files.txt > files_to_check.txt
            fi
            echo "Sweep reviews $(wc -l < files_to_check.txt) of $(wc -l < all_files.txt) files."
          else
            git diff --name-only \
              origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'R/*.R' \
              > files_to_check.txt
          fi
          echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count != '0'
        with:
          use-public-rspm: true

      # needs: check installs the target package's own Imports/Suggests
      # (testthat, and — for DataSHIELD client packages — DSLite/DSI/the
      # relevant server package) from ITS DESCRIPTION. The package itself is
      # loaded from source by run_test_blocks() via testthat/pkgload.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count != '0'
        with:
          extra-packages: any::httr2, any::jsonlite, any::purrr, any::config, any::testthat
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/anthropic-token@main
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Run test suggestion script
        if: steps.files.outputs.count != '0'
        env:
          R_CONFIG_ACTIVE: test-review
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_tests.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/resolve-push-token@main
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit generated tests
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/commit-updated-files@main
        with:
          scan-mode: ${{ inputs.scan-mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'test: suggested test changes for'
          sub-branch-prefix: 'bot-suggest/tests'
          sub-pr-title: 'Test suggestions'
          sub-pr-body: 'New and updated tests from the test-coverage-suggest workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          sweep-base: ${{ inputs.sweep-base }}
          pr-body-file: 'suggestion_report.md'
          sweep-branch-prefix: 'bot-suggest/tests-sweep'
          sweep-commit-message: 'test: monthly test coverage sweep'
          sweep-pr-title: 'Monthly test coverage sweep'
          sweep-pr-body: 'New and updated tests from the test-coverage-suggest workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'
