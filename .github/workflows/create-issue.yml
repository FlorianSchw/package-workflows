name: Create issue on test failure
on:
  workflow_call:
    inputs:
      pr_author:
        description: 'GitHub login to assign the issue to'
        required: true
        type: string
      run_url:
        description: 'URL of the failed run, linked in the issue'
        required: true
        type: string
      template:
        description: 'Issue template path in this repo'
        required: false
        type: string
        default: .github/pr-issue-template.md
      extra_assignees:
        description: 'Comma-separated additional assignees'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Shared files
        uses: $/.github/actions/shared-files

      - name: Build assignee list
        id: all_assignees
        # Inputs through the environment, never written into the script
        # itself (a crafted value could otherwise run as shell code).
        env:
          PR_AUTHOR: ${{ inputs.pr_author }}
          EXTRA_ASSIGNEES: ${{ inputs.extra_assignees }}
        run: |
          combined="$PR_AUTHOR,$EXTRA_ASSIGNEES"
          deduped=$(echo "$combined" | tr ',' '\n' | sed '/^\s*$/d' | sed 's/^ *//;s/ *$//' | sort -u | paste -sd ',' -)
          echo "list=$deduped" >> "$GITHUB_OUTPUT"

      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          RUN_URL: ${{ inputs.run_url }}
        with:
          filename: .shared-workflows/${{ inputs.template }}
          assignees: ${{ steps.all_assignees.outputs.list }}
