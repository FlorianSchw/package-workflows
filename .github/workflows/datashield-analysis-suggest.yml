name: DataSHIELD Analysis Suggestions

on:
  workflow_call:
    inputs:
      plan-file:
        description: 'The analysis plan, relative to the repository root'
        required: false
        type: string
        default: 'config/analysis-plan.yml'
      dsanalysis-repository:
        description: 'Repository of dsAnalysis, whose functions update the DSLite test setup'
        required: false
        type: string
        default: 'FlorianSchw/dsAnalysis'
      dsanalysis-ref:
        description: 'Branch or tag of dsAnalysis to use'
        required: false
        type: string
        default: 'main'
    secrets:
      anthropic-organization-id:
        description: 'Anthropic organization ID.'
        required: true
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo.'
        required: true
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow.'
        required: true
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-analysis:
    if: ${{ !startsWith(github.ref_name, 'bot-suggest/') }}
    runs-on: ubuntu-latest
    # Quick successive pushes to the plan: the newest run replaces the
    # older one, instead of both force-pushing the same bot branch.
    concurrency:
      group: datashield-analysis-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    # Installs + up to two Claude rounds with test runs; caps a hanging test run.
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Checkout dsAnalysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs
          repository: ${{ inputs.dsanalysis-repository }}
          ref: ${{ inputs.dsanalysis-ref }}
          path: .dsanalysis

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: >-
            any::httr2, any::jsonlite, any::purrr, any::yaml,
            any::pak, any::callr, any::here, any::stringr, any::DSI, any::DSLite

      - name: Get Anthropic access token
        id: anthropic_auth
        uses: $/.github/actions/anthropic-token
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Draft and test the analysis scripts
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          # For renewing the token in a long run (refresh_anthropic_token()).
          ANTHROPIC_ORG_ID: ${{ secrets.anthropic-organization-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.anthropic-service-account-id }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.anthropic-federation-rule-id }}
          # Read-only use: open issues of the gap collection repo. The test
          # run of the generated scripts gets no tokens.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_FILE: ${{ inputs.plan-file }}
          DSANALYSIS_DIR: .dsanalysis
        run: Rscript .shared-workflows/R/suggest_datashield_analysis.R

      - name: Resolve push token
        id: push_token
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Propose the scripts
        uses: $/.github/actions/commit-updated-files
        with:
          scan-mode: changed
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'feat: suggested analysis file'
          sub-branch-prefix: 'bot-suggest/analysis'
          sub-pr-title: 'DataSHIELD analysis scripts'
          sub-pr-body: 'Drafted from your analysis plan by the datashield-analysis-suggest workflow.'
          pr-body-file: 'suggestion_report.md'
          # Every run regenerates all steps not yet in the branch, so the bot
          # branch is rebuilt rather than built on.
          open-suggestion-pr: 'replace'

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always()
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: datashield-analysis-suggest
          job-status: ${{ job.status }}
