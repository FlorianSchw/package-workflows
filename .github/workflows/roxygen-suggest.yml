name: Roxygen Doc Suggestions

on:
  workflow_call:
    inputs:
      review-scope:
        description: '"changed": what changed since the last review (for a PR or push since its last run, for a scheduled or manual run since the last review of the branch); "all": every R/*.R file, a full review'
        required: false
        type: string
        default: 'changed'
      review-branch:
        description: 'Branch of scheduled and manual runs (and of the full review PR); empty: the chosen branch on manual runs, dev on schedules'
        required: false
        type: string
        default: ''
      open-suggestion-pr:
        description: 'When a bot PR is still open: "add" this run''s suggestions to it, or "replace" its content'
        required: false
        type: string
        default: 'add'
      accept-reasons:
        description: 'Reasons that lead to a proposed change, comma-separated, from: missing, inaccurate, incomplete, clarity, style; empty: those with `accept: true` in `config/suggestion-policy.yml` (missing, inaccurate, incomplete)'
        required: false
        type: string
        default: ''
      code-issue-confidence:
        description: 'Possible bugs in the code to report, by how sure Claude is: "high", "high,medium" or "high,medium,low"; "none": not looked for, no such section in the report; empty: `possible_bugs: report` in `config/suggestion-policy.yml` (high, medium)'
        required: false
        type: string
        default: ''
      datashield-type:
        description: '"none" (not a DataSHIELD package), "client", "server" or "utility" (analyst-side helpers)'
        required: false
        type: string
        default: 'none'
      self-test-fixture:
        description: 'Only for the workflow repository''s own CI — leave empty. A fixture package of its tests/fixtures/ to review instead of this repository, with recorded Claude answers; nothing is pushed or counted.'
        required: false
        type: string
        default: ''
    secrets:
      anthropic-organization-id:
        description: 'Anthropic organization ID.'
        required: true
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo.'
        required: true
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow.'
        required: true
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-docs:
    runs-on: ubuntu-latest
    # Push and PR runs of one branch write the same bot branch: one at a time.
    concurrency:
      group: roxygen-suggest-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write         # possible code bugs from a sweep without a suggestion PR
      actions: read         # earlier runs: what the last review covered (review-history.sh)
      checks: read          # their annotations: reviewed commit, failed calls

    steps:
      # $/ = this workflow's own repository at the running commit (no
      # checkout needed), so a caller pinned to a version gets that
      # version's actions.
      - name: Resolve scope
        id: scope
        uses: $/.github/actions/resolve-suggestion-scope
        with:
          review-scope: ${{ inputs.self-test-fixture != '' && 'all' || inputs.review-scope }}
          review-branch: ${{ inputs.review-branch }}

      # The calling repository first — actions/checkout empties the folder
      # it checks out into, so the shared scripts can only come after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.skip != 'true' && inputs.self-test-fixture == ''
        with:
          persist-credentials: false   # pushes pass their token explicitly
          ref: ${{ steps.scope.outputs.ref }}
          fetch-depth: 0

      # Scripts, config and prompts at the commit of this workflow.
      - name: Shared scripts
        if: steps.scope.outputs.skip != 'true'
        uses: $/.github/actions/shared-files

      # Self-test (the workflow repository's own CI): the fixture package
      # takes the place of the caller, as a fresh git repository.
      - name: Use the self-test fixture
        if: steps.scope.outputs.skip != 'true' && inputs.self-test-fixture != ''
        env:
          FIXTURE: ${{ inputs.self-test-fixture }}
        run: bash .shared-workflows/tests/self-test/use-fixture.sh "$FIXTURE"

      - name: Determine files to check
        id: files
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.scope.outputs.branch }}
          MODE: ${{ steps.scope.outputs.mode }}
          FILE_PATTERN: 'R/*.R'
        run: |
          if [ "$MODE" = "all" ]; then
            find R -name '*.R' | sort > files_to_check.txt
            echo "Full review of $(wc -l < files_to_check.txt) files."
            echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"
            echo "reviewed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            SUB_BRANCH="bot-suggest/docs/${BRANCH//\//-}"
            echo "sub_branch=$SUB_BRANCH" >> "$GITHUB_OUTPUT"
            BOT_CONFIG=".shared-workflows/config/bot-authors.yml"  # a project's own copy is merged over it
            SUB_BRANCH="$SUB_BRANCH" BOT_CONFIG="$BOT_CONFIG" bash .shared-workflows/.github/actions/resolve-suggestion-scope/determine-changes.sh
          fi

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.files.outputs.count > 0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.files.outputs.count > 0
        with:
          extra-packages: any::roxygen2, any::httr2, any::jsonlite, any::purrr, any::yaml
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count > 0 && inputs.self-test-fixture == ''
        uses: $/.github/actions/anthropic-token
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Run roxygen suggestion script
        if: steps.files.outputs.count > 0
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          # For renewing the token in a long run (refresh_anthropic_token()).
          ANTHROPIC_ORG_ID: ${{ secrets.anthropic-organization-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.anthropic-service-account-id }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.anthropic-federation-rule-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
          # PR and push runs (empty in a sweep): an open bot PR is built on —
          # its findings merged with this run's, its proposed blocks the
          # starting point of the review.
          SUB_BRANCH: ${{ steps.files.outputs.sub_branch }}
          REVIEWED_SHA: ${{ steps.files.outputs.reviewed_sha }}
          BASE_REV: ${{ steps.files.outputs.base_rev }}
          OPEN_SUGGESTION_PR: ${{ inputs.open-suggestion-pr }}
          REBUILD: ${{ steps.files.outputs.rebuild }}
          CODE_ISSUE_CONFIDENCE: ${{ inputs.code-issue-confidence }}
          ACCEPT_REASONS: ${{ inputs.accept-reasons }}
          CLAUDE_RECORDED_ANSWERS: ${{ inputs.self-test-fixture != '' && format('.shared-workflows/tests/fixtures/claude-answers/{0}.json', inputs.self-test-fixture) || '' }}
        run: Rscript .shared-workflows/R/suggest_roxygen.R

      - name: Keep the self-test results
        if: always() && inputs.self-test-fixture != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-roxygen-${{ inputs.self-test-fixture }}
          path: |
            updated_files.txt
            suggestion_report.md
            suggestion_summary.md
            R/
          if-no-files-found: error

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count > 0 && inputs.self-test-fixture == ''
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit roxygen suggestions
        if: steps.files.outputs.count > 0 && inputs.self-test-fixture == ''
        uses: $/.github/actions/commit-updated-files
        with:
          scan-mode: ${{ steps.scope.outputs.mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'docs: apply roxygen suggestion for'
          sub-branch-prefix: 'bot-suggest/docs'
          sub-pr-title: 'Roxygen documentation suggestions'
          sub-pr-body: 'Automated roxygen2 documentation suggestions. Review and merge to include them.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          reviewed-sha: ${{ steps.files.outputs.reviewed_sha }}
          open-suggestion-pr: ${{ inputs.open-suggestion-pr }}
          rebuild: ${{ steps.files.outputs.rebuild }}
          pr-body-file: 'suggestion_report.md'
          pr-body-mode: 'replace'   # the report is rebuilt from all findings each run
          comment-summary-file: 'suggestion_summary.md'
          sweep-base: ${{ steps.scope.outputs.branch }}
          sweep-branch-prefix: 'bot-suggest/docs-all'
          sweep-commit-message: 'docs: monthly roxygen suggestion sweep'
          sweep-pr-title: 'Roxygen documentation: full review'
          sweep-pr-body: 'Automated suggestions from the roxygen doc-assist workflow. Review before merging.'

      # What this review covered, as an annotation of the run: the next
      # scheduled or manual run starts from here (review-history.sh). Files
      # whose Claude call failed are its "Suggestion not made" warnings.
      - name: Record review
        if: success() && steps.scope.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.scope.outputs.branch }}
          MODE: ${{ steps.scope.outputs.mode }}
          REVIEWED_SHA: ${{ steps.files.outputs.reviewed_sha }}
        run: echo "::notice title=bot-suggest review::docs $BRANCH $REVIEWED_SHA"

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always() && steps.scope.outputs.skip != 'true' && inputs.self-test-fixture == ''   # not when skipped (bot branch, fork, …) or a self-test
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: roxygen-suggest
          job-status: ${{ job.status }}
