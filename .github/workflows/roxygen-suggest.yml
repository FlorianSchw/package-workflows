name: Roxygen Doc Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"changed" (diff against PR base) or "all" (every R/*.R file)'
        required: false
        type: string
        default: 'changed'
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule authorizing this repo'
        required: true
        type: string
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client" or "server" — only used when datashield is true'
        required: false
        type: string
        default: ''
    secrets:
      app-id:
        description: 'GitHub App ID — to create a short-lived App token. Optional'
        required: false
      app-private-key:
        description: 'GitHub App private key — to create a short-lived App token. Optional'
        required: false
      commit-push-pat:
        description: 'A classic or fine-grained PAT. Optional.'
        required: false

jobs:
  suggest-docs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v7
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      - name: Determine files to check
        id: files
        run: |
          if [ "${{ inputs.scan-mode }}" = "all" ]; then
            find R -name '*.R' > files_to_check.txt
          else
            git diff --name-only \
              origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'R/*.R' \
              > files_to_check.txt
          fi
          echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count != '0'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count != '0'
        with:
          extra-packages: any::roxygen2, any::httr2, any::jsonlite, any::purrr, any::config
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/anthropic-token@main
        with:
          federation-rule-id: ${{ inputs.anthropic-federation-rule-id }}

      - name: Create .Renviron file
        if: steps.files.outputs.count != '0'
        run: |
          echo R_CONFIG_ACTIVE = "roxygen-review" >> .Renviron
        shell: bash

      - name: Run roxygen suggestion script
        if: steps.files.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_roxygen.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/resolve-push-token@main
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit roxygen suggestions
        if: steps.files.outputs.count != '0'
        uses: FlorianSchw/package-workflows/.github/actions/commit-updated-files@main
        with:
          scan-mode: ${{ inputs.scan-mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'docs: apply roxygen suggestion for'
          sub-branch-prefix: 'bot-suggest/docs'
          sub-pr-title: 'Roxygen documentation suggestions'
          sub-pr-body: 'Automated roxygen2 documentation suggestions. Review and merge to include them.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          sweep-branch-prefix: 'docs/roxygen-sweep'
          sweep-commit-message: 'docs: monthly roxygen suggestion sweep'
          sweep-pr-title: 'Monthly roxygen documentation sweep'
          sweep-pr-body: 'Automated suggestions from the roxygen doc-assist workflow. Review before merging.'
