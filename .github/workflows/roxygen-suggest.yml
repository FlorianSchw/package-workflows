name: Roxygen Doc Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"changed" (diff against PR base) or "all" (every R/*.R file)'
        required: false
        type: string
        default: 'changed'
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule authorizing this repo'
        required: true
        type: string
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client" or "server" — only used when datashield is true'
        required: false
        type: string
        default: ''

env:
  ANTHROPIC_ORG_ID: ab598c51-a4e1-4c60-943d-c04722aecf04
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_018HwE11GfPMYQhCYUQPeDS7

jobs:
  suggest-docs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          # For pull_request events, check out the real head branch by name
          # (not the default detached merge-commit checkout) so a later
          # commit + push actually lands on the PR's own branch. Falls back
          # to the default ref for non-PR triggers (schedule/workflow_dispatch,
          # used by "all" mode, which creates its own separate branch anyway).
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      - name: Determine files to check
        id: files
        run: |
          if [ "${{ inputs.scan-mode }}" = "all" ]; then
            find R -name '*.R' > files_to_check.txt
          else
            git diff --name-only \
              origin/${{ github.event.pull_request.base.ref }}...HEAD -- 'R/*.R' \
              > files_to_check.txt
          fi
          echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count != '0'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count != '0'
        with:
          extra-packages: any::roxygen2, any::httr2, any::jsonlite, any::purrr, any::config
          needs: check

      - name: Get GitHub OIDC token
        id: oidc
        if: steps.files.outputs.count != '0'
        run: |
          RESPONSE=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com")
          echo "github_token=$(echo "$RESPONSE" | jq -r '.value')" >> "$GITHUB_OUTPUT"

      - name: Exchange for Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count != '0'
        run: |
          RESPONSE=$(curl -sS -X POST https://api.anthropic.com/v1/oauth/token \
            -H "Content-Type: application/json" \
            -d '{
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": "${{ steps.oidc.outputs.github_token }}",
              "federation_rule_id": "${{ inputs.anthropic-federation-rule-id }}",
              "organization_id": "${{ env.ANTHROPIC_ORG_ID }}",
              "service_account_id": "${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}"
            }')
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::Token exchange failed: $(echo "$RESPONSE" | jq -c '.')"
            exit 1
          fi
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Create .Renviron file
        if: steps.files.outputs.count != '0'
        run: |
          touch .Renviron
          echo R_CONFIG_ACTIVE = "roxygen-review" >> .Renviron

          echo "cat .Renviron"
          cat .Renviron

          echo "ls -a ."
          ls -a .

          echo "ls -a ${{ github.workspace }}"
          ls -a ${{ github.workspace }}
        shell: bash

      - name: Run roxygen suggestion script
        if: steps.files.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_MODE: ${{ inputs.scan-mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_roxygen.R

      - name: Commit roxygen suggestions to PR branch
        if: inputs.scan-mode == 'changed' && steps.files.outputs.count != '0'
        run: |
          if [ ! -s docs_updated_files.txt ]; then
            echo "No files were updated — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r f; do
            git add "$f"
            git commit -m "docs: apply roxygen suggestion for $f"
          done < docs_updated_files.txt

          git push

      - name: Check for changes
        id: diff
        if: inputs.scan-mode == 'all' && steps.files.outputs.count != '0'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with suggested docs
        if: inputs.scan-mode == 'all' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="docs/roxygen-sweep-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add R/
          git commit -m "docs: monthly roxygen suggestion sweep"
          git push origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Monthly roxygen documentation sweep" \
            --body "Automated suggestions from the roxygen doc-assist workflow. Review before merging."
