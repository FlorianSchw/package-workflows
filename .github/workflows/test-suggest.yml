name: Test Coverage Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"auto" (= "changed": what changed since the last review — for a PR or push since the last run, for a scheduled or manual run since the last review of the branch) or "all" (every R/*.R file, e.g. a manual full review)'
        required: false
        type: string
        default: 'auto'
      sweep-base:
        description: 'Branch of scheduled and manual runs (and of the full review PR); empty: the chosen branch on manual runs, dev on schedules'
        required: false
        type: string
        default: ''
      open-suggestion-pr:
        description: 'When a bot PR is still open: "add" this run''s suggestions to it, or "replace" its content'
        required: false
        type: string
        default: 'add'
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client", "server" or "utility" (analyst-side helpers) — required when datashield is true'
        required: false
        type: string
        default: ''
      accept-reasons:
        description: 'Reasons a new test must have to be proposed, comma-separated, from: uncovered_branch, error_handling, edge_case, regression, other; empty: `accept_reasons` in `config/claude.yml` (all but other)'
        required: false
        type: string
        default: ''
      code-issue-confidence:
        description: 'Possible bugs in the code to report, by how sure Claude is: "high", "high,medium" or "high,medium,low" (an issue is opened only for high); "none": reported as ordinary notes and failed tests; empty: `code_issue_confidence` in `config/claude.yml` (high, medium)'
        required: false
        type: string
        default: ''
      dslite-setup:
        description: 'For functions using DataSHIELD connections: "auto" (create a DSLite test setup only if the tests have no way to connect yet), "create" (create one unless the tests already use DSLite) or "never"'
        required: false
        type: string
        default: 'auto'
    secrets:
      anthropic-organization-id:
        description: 'Anthropic organization ID.'
        required: true
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo.'
        required: true
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow.'
        required: true
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    # Push and PR runs of one branch write the same bot branch: one at a time.
    concurrency:
      group: test-suggest-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read         # earlier runs: what the last review covered (review-history.sh)
      checks: read          # their annotations: reviewed commit, failed calls

    steps:
      # $/ = this workflow's own repository at the running commit (no
      # checkout needed), so a caller pinned to a version gets that
      # version's actions.
      - name: Resolve scope
        id: scope
        uses: $/.github/actions/resolve-suggestion-scope
        with:
          scan-mode: ${{ inputs.scan-mode }}
          sweep-base: ${{ inputs.sweep-base }}

      # The calling repository first — actions/checkout empties the folder
      # it checks out into, so the shared scripts can only come after it.
      - uses: actions/checkout@v7
        if: steps.scope.outputs.skip != 'true'
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs
          ref: ${{ steps.scope.outputs.ref }}
          fetch-depth: 0

      # Scripts, config and prompts at the commit of this workflow.
      - name: Checkout shared scripts
        if: steps.scope.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs
          repository: FlorianSchw/package-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .shared-workflows

      - name: Determine files to check
        id: files
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.scope.outputs.branch }}
          MODE: ${{ steps.scope.outputs.mode }}
          FILE_PATTERN: 'R/*.R'
        run: |
          if [ "$MODE" = "all" ]; then
            find R -name '*.R' | sort > files_to_check.txt
            echo "Full review of $(wc -l < files_to_check.txt) files."
            echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"
            echo "reviewed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            SUB_BRANCH="bot-suggest/tests/${BRANCH//\//-}"
            echo "sub_branch=$SUB_BRANCH" >> "$GITHUB_OUTPUT"
            BOT_CONFIG="config/bot-authors.json"; [ -f "$BOT_CONFIG" ] || BOT_CONFIG=".shared-workflows/$BOT_CONFIG"
            SUB_BRANCH="$SUB_BRANCH" BOT_CONFIG="$BOT_CONFIG" bash .shared-workflows/.github/actions/resolve-suggestion-scope/determine-changes.sh
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count > 0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count > 0
        with:
          extra-packages: any::httr2, any::jsonlite, any::purrr, any::config, any::testthat, any::callr
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count > 0
        uses: $/.github/actions/anthropic-token
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Run test suggestion script
        if: steps.files.outputs.count > 0
        env:
          R_CONFIG_ACTIVE: test-review
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          # For renewing the token in a long run (refresh_anthropic_token()).
          ANTHROPIC_ORG_ID: ${{ secrets.anthropic-organization-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.anthropic-service-account-id }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.anthropic-federation-rule-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The state before this run's changes, for the history evidence
          # (empty in a sweep).
          BASE_REV: ${{ steps.files.outputs.base_rev }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
          DSLITE_SETUP: ${{ inputs.dslite-setup }}
          CODE_ISSUE_CONFIDENCE: ${{ inputs.code-issue-confidence }}
          ACCEPT_REASONS: ${{ inputs.accept-reasons }}
          # PR and push runs (empty in a sweep): an open bot PR is built on —
          # its findings merged with this run's, its test files the starting
          # point.
          SUB_BRANCH: ${{ steps.files.outputs.sub_branch }}
          REVIEWED_SHA: ${{ steps.files.outputs.reviewed_sha }}
          OPEN_SUGGESTION_PR: ${{ inputs.open-suggestion-pr }}
          REBUILD: ${{ steps.files.outputs.rebuild }}
        run: Rscript .shared-workflows/R/suggest_tests.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count > 0
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit generated tests
        if: steps.files.outputs.count > 0
        uses: $/.github/actions/commit-updated-files
        with:
          scan-mode: ${{ steps.scope.outputs.mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'test: suggested test changes for'
          sub-branch-prefix: 'bot-suggest/tests'
          sub-pr-title: 'Test suggestions'
          sub-pr-body: 'New and updated tests from the test suggestion workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          reviewed-sha: ${{ steps.files.outputs.reviewed_sha }}
          open-suggestion-pr: ${{ inputs.open-suggestion-pr }}
          rebuild: ${{ steps.files.outputs.rebuild }}
          sweep-base: ${{ steps.scope.outputs.branch }}
          pr-body-file: 'suggestion_report.md'
          pr-body-mode: 'replace'   # the report is rebuilt from all findings each run
          comment-summary-file: 'suggestion_summary.md'
          sweep-branch-prefix: 'bot-suggest/tests-sweep'
          sweep-commit-message: 'test: monthly test coverage sweep'
          sweep-pr-title: 'Monthly test coverage sweep'
          sweep-pr-body: 'New and updated tests from the test suggestion workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'

      # What this review covered, as an annotation of the run: the next
      # scheduled or manual run starts from here (review-history.sh). Files
      # whose Claude call failed are its "Suggestion not made" warnings.
      - name: Record review
        if: success() && steps.scope.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.scope.outputs.branch }}
          MODE: ${{ steps.scope.outputs.mode }}
          REVIEWED_SHA: ${{ steps.files.outputs.reviewed_sha }}
        run: echo "::notice title=bot-suggest review::tests $BRANCH $REVIEWED_SHA"

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always() && steps.scope.outputs.skip != 'true'   # not when the run was skipped (bot branch, fork, …)
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: test-suggest
          job-status: ${{ job.status }}
