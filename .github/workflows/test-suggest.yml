name: Test Coverage Suggestions

on:
  workflow_call:
    inputs:
      scan-mode:
        description: '"auto" (PR or push: what is new since the last run; schedule or manual run: sweep), "changed" or "all" (sweep of R/*.R, see sweep-* inputs)'
        required: false
        type: string
        default: 'auto'
      sweep-base:
        description: 'Sweep: branch to scan and to open the sweep PR against; empty: the chosen branch on manual runs, dev on schedules'
        required: false
        type: string
        default: ''
      sweep-lookback-days:
        description: 'Sweep: review functions whose file or test changed within this many days'
        required: false
        type: number
        default: 35
      sweep-rotation-months:
        description: 'Sweep: also review every function at least once in this many months (0: all, every sweep)'
        required: false
        type: number
        default: 6
      open-suggestion-pr:
        description: 'When a bot PR is still open: "add" this run''s suggestions to it, or "replace" its content'
        required: false
        type: string
        default: 'add'
      datashield:
        description: 'Whether this repo is a DataSHIELD package'
        required: false
        type: boolean
        default: false
      datashield-type:
        description: '"client", "server" or "utility" (analyst-side helpers) — required when datashield is true'
        required: false
        type: string
        default: ''
    secrets:
      anthropic-organization-id:
        description: 'Anthropic organization ID.'
        required: true
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo.'
        required: true
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow.'
        required: true
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    # Push and PR runs of one branch write the same bot branch: one at a time.
    concurrency:
      group: test-suggest-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Resolve scope
        id: scope
        uses: FlorianSchw/package-workflows/.github/actions/resolve-suggestion-scope@main
        with:
          scan-mode: ${{ inputs.scan-mode }}
          sweep-base: ${{ inputs.sweep-base }}

      - uses: actions/checkout@v7
        if: steps.scope.outputs.skip != 'true'
        with:
          ref: ${{ steps.scope.outputs.ref }}
          fetch-depth: 0

      - name: Checkout shared scripts
        if: steps.scope.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: FlorianSchw/package-workflows
          ref: main
          path: .shared-workflows

      - name: Determine files to check
        id: files
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.scope.outputs.branch }}
          FILE_PATTERN: 'R/*.R'
          LOOKBACK_DAYS: ${{ inputs.sweep-lookback-days }}
          ROTATION: ${{ inputs.sweep-rotation-months }}
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = "all" ]; then
            find R -name '*.R' | sort > all_files.txt
            if [ "$ROTATION" -le 0 ]; then
              cp all_files.txt files_to_check.txt
            else
              git log --since="$LOOKBACK_DAYS days ago" --name-only --format= -- R tests/testthat | sort -u > recent_files.txt
              slot=$(( ($(date +%Y) * 12 + 10#$(date +%m)) % ROTATION ))
              while IFS= read -r f; do
                test_file="tests/testthat/test-$(basename "$f" .R).R"
                if grep -qxF -e "$f" -e "$test_file" recent_files.txt \
                   || [ $(( $(printf '%s' "$f" | cksum | cut -d' ' -f1) % ROTATION )) -eq "$slot" ]; then
                  echo "$f"
                fi
              done < all_files.txt > files_to_check.txt
            fi
            echo "Sweep reviews $(wc -l < files_to_check.txt) of $(wc -l < all_files.txt) files."
            echo "count=$(wc -l < files_to_check.txt)" >> "$GITHUB_OUTPUT"
          else
            SUB_BRANCH="bot-suggest/tests/${BRANCH//\//-}"
            BOT_CONFIG="config/bot-authors.json"; [ -f "$BOT_CONFIG" ] || BOT_CONFIG=".shared-workflows/$BOT_CONFIG"
            SUB_BRANCH="$SUB_BRANCH" BOT_CONFIG="$BOT_CONFIG" bash .shared-workflows/.github/actions/resolve-suggestion-scope/determine-changes.sh
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.files.outputs.count > 0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.files.outputs.count > 0
        with:
          extra-packages: any::httr2, any::jsonlite, any::purrr, any::config, any::testthat
          needs: check

      - name: Get Anthropic access token
        id: anthropic_auth
        if: steps.files.outputs.count > 0
        uses: FlorianSchw/package-workflows/.github/actions/anthropic-token@main
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Run test suggestion script
        if: steps.files.outputs.count > 0
        env:
          R_CONFIG_ACTIVE: test-review
          ANTHROPIC_API_KEY: ${{ steps.anthropic_auth.outputs.access-token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The state before this run's changes, for the history evidence
          # (empty in a sweep).
          BASE_REV: ${{ steps.files.outputs.base_rev }}
          DATASHIELD: ${{ inputs.datashield }}
          DATASHIELD_TYPE: ${{ inputs.datashield-type }}
        run: Rscript .shared-workflows/R/suggest_tests.R

      - name: Resolve push token
        id: push_token
        if: steps.files.outputs.count > 0
        uses: FlorianSchw/package-workflows/.github/actions/resolve-push-token@main
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit generated tests
        if: steps.files.outputs.count > 0
        uses: FlorianSchw/package-workflows/.github/actions/commit-updated-files@main
        with:
          scan-mode: ${{ steps.scope.outputs.mode }}
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'test: suggested test changes for'
          sub-branch-prefix: 'bot-suggest/tests'
          sub-pr-title: 'Test suggestions'
          sub-pr-body: 'New and updated tests from the test suggestion workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'
          origin-pr-number: ${{ github.event.pull_request.number }}
          reviewed-sha: ${{ steps.files.outputs.reviewed_sha }}
          open-suggestion-pr: ${{ inputs.open-suggestion-pr }}
          rebuild: ${{ steps.files.outputs.rebuild }}
          sweep-base: ${{ steps.scope.outputs.branch }}
          pr-body-file: 'suggestion_report.md'
          comment-summary-file: 'suggestion_summary.md'
          sweep-branch-prefix: 'bot-suggest/tests-sweep'
          sweep-commit-message: 'test: monthly test coverage sweep'
          sweep-pr-title: 'Monthly test coverage sweep'
          sweep-pr-body: 'New and updated tests from the test suggestion workflow. Every new or changed test passed a real run; changes to existing tests are listed below with their reason — review before merging.'
