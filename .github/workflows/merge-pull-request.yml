name: Merge Pull Request

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Number of the PR to merge'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ inputs.pr_number }} --merge --repo ${{ github.repository }}
