name: Release

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Only report the next version and release notes; release nothing'
        required: false
        type: boolean
        default: false
    secrets:
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      # The fallback .releaserc.json (a caller's own wins), from the same
      # commit as this workflow.
      - name: Shared release config
        uses: $/.github/actions/shared-files
        with:
          path: .shared-config

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: any::desc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install semantic-release and plugins
        # No lockfile: the caller has no package.json, and this repository ships
        # none yet (open: pin versions or commit a lockfile with the v1 release
        # setup). Signatures are checked in the next step.
        # conventionalcommits: the preset the configs use, so "feat!:" counts as
        # breaking like a BREAKING CHANGE: footer (the default angular preset
        # only knows the footer); 8.0.0 is what commit-analyzer 13 is tested with.
        run: npm install semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/exec conventional-changelog-conventionalcommits@8.0.0  # zizmor: ignore[adhoc-packages]

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Resolve push token
        id: push_token
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ ! -f .releaserc.json ]; then ARGS+=(--extends ./.shared-config/.releaserc.json); fi
          npx semantic-release "${ARGS[@]}"
