#### GitHub Action to increment the public-facing version based on semantic versioning v2

name: Release
on:
  workflow_call:
    inputs:
      config-repo:
        description: 'owner/repo of the shared workflow repo holding the base .releaserc.json'
        required: false
        type: string
        default: 'FlorianSchw/package-workflows'
      config-ref:
        description: 'Tag/branch of the shared workflow repo to pull release config from'
        required: false
        type: string
        default: 'v1'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout shared release config
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.config-repo }}
          ref: ${{ inputs.config-ref }}
          path: .shared-config

      - name: setup r environment
        uses: r-lib/actions/setup-r@v2

      - name: install necessary r dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::desc
          needs: check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install semantic-release
        run: npm i semantic-release
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Install more dependencies
        run: npm install @semantic-release/git @semantic-release/changelog @semantic-release/exec -D

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
        run: |
          if [ -f .releaserc.json ]; then
            npx semantic-release
          else
            npx semantic-release --extends ./.shared-config/.releaserc.json
          fi

