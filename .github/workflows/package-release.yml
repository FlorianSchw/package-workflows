name: Release

on:
  workflow_call:
    inputs:
      config-repo:
        description: 'owner/repo holding the fallback .releaserc.json'
        required: false
        type: string
        default: 'FlorianSchw/package-workflows'
      config-ref:
        description: 'Ref of config-repo to read .releaserc.json from; empty: the commit of this workflow (the version the caller uses)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Only report the next version and release notes; release nothing'
        required: false
        type: boolean
        default: false
    secrets:
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout shared release config
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.config-repo }}
          ref: ${{ inputs.config-ref || github.job_workflow_sha }}
          path: .shared-config

      # This workflow's own actions, at its commit (config-repo may be
      # another repository).
      - name: Checkout shared actions
        uses: actions/checkout@v7
        with:
          repository: FlorianSchw/package-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .shared-workflows
          sparse-checkout: .github/actions

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::desc

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install semantic-release and plugins
        run: npm install semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/exec

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Resolve push token
        id: push_token
        uses: ./.shared-workflows/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ ! -f .releaserc.json ]; then ARGS+=(--extends ./.shared-config/.releaserc.json); fi
          npx semantic-release "${ARGS[@]}"
