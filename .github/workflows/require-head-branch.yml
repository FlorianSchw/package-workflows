name: Require Head Branch

on:
  workflow_call:
    inputs:
      allowed-head:
        description: 'The only branch name a PR into the target branch may come from.'
        required: true
        type: string

jobs:
  verify-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        # Branch names through the environment, never written into the
        # script itself (a crafted name could otherwise run as shell code).
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ALLOWED_HEAD: ${{ inputs.allowed-head }}
        run: |
          if [ "$HEAD_REF" != "$ALLOWED_HEAD" ]; then
            echo "::error::PRs into this branch must come from '$ALLOWED_HEAD', not '$HEAD_REF'."
            exit 1
          fi
