name: Workflow Graphs

on:
  workflow_call:
    secrets:
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token can push to a protected branch (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  workflow-graphs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Two merges in quick succession: the second run waits instead of racing.
    concurrency:
      group: workflow-graphs-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: any::yaml, any::httr2, any::jsonlite, any::purrr

      - name: Draw workflow diagrams
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: Rscript .shared-workflows/R/workflow_graphs.R

      - name: Resolve push token
        id: push_token
        if: github.event_name != 'pull_request'
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Commit the README
        if: github.event_name != 'pull_request'
        uses: $/.github/actions/commit-and-push
        with:
          files: .github/workflow-graphs/README.md
          commit-message: 'docs: update workflow diagrams'
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || github.token }}
