name: R-CMD-check

on:
  workflow_call:
    inputs:
      os-list:
        description: 'JSON array of runner OSes'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      r-version-list:
        description: 'JSON array of R versions to test'
        required: false
        type: string
        default: '["release", "oldrel-1", "oldrel-2"]'
      run-codecov:
        description: 'Upload coverage to Codecov (first matrix cell only)'
        required: false
        type: boolean
        default: true
      extra-apt-packages:
        description: 'Space-separated apt packages, e.g. "libcurl4-openssl-dev"'
        required: false
        type: string
        default: ''
      extra-r-packages:
        description: 'Comma-separated extra R packages, e.g. "httptest, xml2"'
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov token (required for private repos).'
        required: false

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.r-version }})

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        r-version: ${{ fromJSON(inputs.r-version-list) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install extra apt packages
        if: ${{ inputs.extra-apt-packages != '' }}
        env:
          EXTRA_APT_PACKAGES: ${{ inputs.extra-apt-packages }}
        # Word splitting is intended: a space-separated package list.
        run: |
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $EXTRA_APT_PACKAGES

      - name: Format extra R package list
        id: extra_r_packages
        if: ${{ inputs.extra-r-packages != '' }}
        env:
          EXTRA_R_PACKAGES: ${{ inputs.extra-r-packages }}
        run: |
          formatted=$(echo "$EXTRA_R_PACKAGES" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed 's/^/any::/' \
            | paste -sd, -)
          echo "list=$formatted" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
            ${{ steps.extra_r_packages.outputs.list }}
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true

      - name: Show testthat output
        if: always()
        run: find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Test coverage
        if: ${{ inputs.run-codecov && matrix.os == fromJSON(inputs.os-list)[0] && matrix.r-version == fromJSON(inputs.r-version-list)[0] }}
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            token = Sys.getenv("CODECOV_TOKEN"),
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
